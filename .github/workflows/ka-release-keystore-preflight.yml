name: KA Play release keystore preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-certificate:
    name: Inspect release certificate (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.KAPLAY_RELEASE_KEYSTORE_B64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.KAPLAY_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.KAPLAY_RELEASE_KEY_ALIAS }}
      EXPECTED_SHA256: 97807c6f56415754cffb6d2ffb6cdff642b30bffc3f892dd9bbf513f839e99a8
    steps:
      - name: Set up JDK for keytool only
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect certificate fingerprint
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELEASE_KEYSTORE_BASE64}" || { echo "Missing KAPLAY_RELEASE_KEYSTORE_B64" >&2; exit 1; }
          test -n "${RELEASE_STORE_PASSWORD}" || { echo "Missing KAPLAY_RELEASE_STORE_PASSWORD" >&2; exit 1; }
          test -n "${RELEASE_KEY_ALIAS}" || { echo "Missing KAPLAY_RELEASE_KEY_ALIAS" >&2; exit 1; }

          temp_dir="$(mktemp -d "${RUNNER_TEMP}/ka-release-preflight.XXXXXX")"
          trap 'rm -rf "${temp_dir}"' EXIT
          keystore_path="${temp_dir}/release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          chmod 600 "${keystore_path}"

          certificate_sha256="$(
            keytool -list -v \
              -keystore "${keystore_path}" \
              -storepass "${RELEASE_STORE_PASSWORD}" \
              -alias "${RELEASE_KEY_ALIAS}" 2>/dev/null \
              | awk -F': ' '/SHA256:/{print $2; exit}' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          test -n "${certificate_sha256}" || { echo "Certificate fingerprint unavailable" >&2; exit 1; }

          echo "alias=${RELEASE_KEY_ALIAS}"
          echo "sha256=${certificate_sha256}"
          if [[ "${certificate_sha256}" != "${EXPECTED_SHA256}" ]]; then
            echo "Release certificate does not match the approved prior APK certificate." >&2
            exit 1
          fi
          echo "certificate_match=true"

      - name: Assert preflight is non-build and non-release
        shell: bash
        run: |
          set -euo pipefail
          workflow_file="${GITHUB_WORKSPACE}/.github/workflows/ka-release-keystore-preflight.yml"
          if grep -Eiv 'grep -Eiq' "${workflow_file}" | grep -Eiq 'gradle|assemble|signing|upload-artifact|gh release|publish'; then
            echo "Preflight workflow contains forbidden build/release operation text" >&2
            exit 1
          fi
          echo "read_only_preflight=true"
