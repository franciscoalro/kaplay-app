name: KA Play Android integration test

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KAPLAY_SUPABASE_URL: ${{ vars.KAPLAY_ISOLATED_BASE_URL }}
  KAPLAY_SUPABASE_ANON_KEY: ${{ secrets.KAPLAY_ISOLATED_ANON_KEY }}
  KAPLAY_TEST_EMAIL: ${{ secrets.KAPLAY_ISOLATED_TEST_EMAIL }}
  KAPLAY_TEST_PASSWORD: ${{ secrets.KAPLAY_ISOLATED_TEST_PASSWORD }}

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate isolated backend allowlist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KAPLAY_SUPABASE_URL"
          test -n "$KAPLAY_SUPABASE_ANON_KEY"
          test -n "$KAPLAY_TEST_EMAIL"
          test -n "$KAPLAY_TEST_PASSWORD"
          case "$KAPLAY_SUPABASE_URL" in
            https://*) ;;
            *) echo "Integration requires an HTTPS backend reachable by GitHub Actions" >&2; exit 1 ;;
          esac
          case "$KAPLAY_SUPABASE_URL" in
            *iibureqvpurmbgqupnvl.supabase.co*) echo "Production Supabase URL is forbidden" >&2; exit 1 ;;
          esac
          python3 - <<'PY2'
          import os
          from urllib.parse import urlparse
          url = urlparse(os.environ["KAPLAY_SUPABASE_URL"])
          allowed = [h.strip().lower() for h in os.environ.get("KAPLAY_ALLOWED_BACKEND_HOSTS", "").split(",") if h.strip()]
          if not allowed:
              raise SystemExit("KAPLAY_ALLOWED_BACKEND_HOSTS is required")
          if url.hostname.lower() not in allowed:
              raise SystemExit(f"backend host {url.hostname!r} is not in the explicit allowlist")
          print(f"Using approved isolated host: {url.hostname}")
          PY2
        env:
          KAPLAY_ALLOWED_BACKEND_HOSTS: ${{ vars.KAPLAY_ALLOWED_BACKEND_HOSTS }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create empty local Gradle properties
        run: |
          : > local.properties

      - name: Build integration APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon

      - name: Require sync-specific Android integration tests
        shell: bash
        run: |
          set -euo pipefail
          test -d androidApp/src/androidTest
          sync_tests=$(find androidApp/src/androidTest -type f \( -iname '*Sync*Test.kt' -o -iname '*Supabase*Test.kt' \) -print)
          test -n "$sync_tests" || {
            echo "No sync-specific Android instrumentation tests exist; integration is not approved." >&2
            exit 1
          }
          printf '%s\n' "$sync_tests"

      - name: Run Android emulator integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :androidApp:connectedFullDebugAndroidTest --no-daemon

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-android-integration-reports
          path: |
            androidApp/build/reports/
            androidApp/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 7
