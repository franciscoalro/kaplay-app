name: KA Play isolated SQL validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated PostgreSQL assertions
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .artifacts/ka-etapa18-sql
          bash supabase/tests/run_etapa15_sync_v2_isolated.sh 2>&1 | tee .artifacts/ka-etapa18-sql/console.log

      - name: Upload sanitized SQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-etapa18-isolated-sql-${{ github.run_id }}
          path: .artifacts/ka-etapa18-sql/
          if-no-files-found: warn
          retention-days: 14
