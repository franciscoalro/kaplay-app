name: nuvio-build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: nuvio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-full-debug:
    name: compileFullDebugKotlin
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dorg.gradle.workers.max=2
      KOTLIN_COMPILER_EXECUTION_STRATEGY: in-process
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init MPVKit submodule (shallow, no recursive libass)
        run: |
          git submodule sync -- MPVKit || true
          git -c protocol.version=2 submodule update --init --depth=1 MPVKit || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Accept Android licenses
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate local.properties for runner SDK
        run: |
          sdk_dir="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$sdk_dir" | sed 's#\\#/#g' > local.properties
          echo "wrote: $(cat local.properties)"

      - name: Compile Nuvio full debug Kotlin
        id: compile
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :androidApp:compileFullDebugKotlin --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee "/tmp/gradle-build.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log

      - name: Inspect toolchain
        if: always()
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -1 "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" 2>/dev/null | tail -5 || true