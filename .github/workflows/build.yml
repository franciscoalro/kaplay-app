name: kaplay-build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: kaplay-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-full-debug:
    name: compileFullDebugKotlin
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dorg.gradle.workers.max=2
      KOTLIN_COMPILER_EXECUTION_STRATEGY: in-process
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init MPVKit submodule (shallow, no recursive libass)
        run: |
          git submodule sync -- MPVKit || true
          git -c protocol.version=2 submodule update --init --depth=1 MPVKit || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', '**/*.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Accept Android licenses
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate local.properties for runner SDK
        run: |
          sdk_dir="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$sdk_dir" | sed 's#\\#/#g' > local.properties
          echo "sdk.dir=$sdk_dir" > local.properties

      - name: Compile KAPlay full debug Kotlin
        id: compile
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :androidApp:compileFullDebugKotlin --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee "/tmp/gradle-build.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Run Android host unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:testAndroidHostTest \
            --tests 'com.kaplay.app.features.tomato.TomatoProviderTest' \
            --tests 'com.kaplay.app.core.network.NetworkStatusRepositoryTest' \
            --tests 'com.kaplay.app.features.player.PlayerScreenRuntimeStateTest' \
            --no-daemon --no-parallel --max-workers=2 --stacktrace

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: /tmp/gradle-build.log

      - name: Inspect toolchain
        if: always()
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          ls -1 "${ANDROID_HOME:-/usr/local/android/sdk}/platforms" 2>/dev/null | tail -5 || true

  assemble-full-release:
    name: assembleFullRelease
    runs-on: ubuntu-latest
    needs: compile-full-debug
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dorg.gradle.workers.max=2
      KOTLIN_COMPILER_EXECUTION_STRATEGY: in-process
      KAPLAY_SUPABASE_URL: ${{ secrets.KAPLAY_SUPABASE_URL }}
      KAPLAY_SUPABASE_ANON_KEY: ${{ secrets.KAPLAY_SUPABASE_ANON_KEY }}
      KAPLAY_SUPABASE_FALLBACK_URL: ${{ secrets.KAPLAY_SUPABASE_FALLBACK_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      KAPLAY_RELEASE_STORE_FILE: ${{ secrets.KAPLAY_RELEASE_STORE_FILE }}
      KAPLAY_RELEASE_STORE_PASSWORD: ${{ secrets.KAPLAY_RELEASE_STORE_PASSWORD }}
      KAPLAY_RELEASE_KEY_ALIAS: ${{ secrets.KAPLAY_RELEASE_KEY_ALIAS }}
      KAPLAY_RELEASE_KEY_PASSWORD: ${{ secrets.KAPLAY_RELEASE_KEY_PASSWORD }}
      KAPLAY_RELEASE_KEYSTORE_BASE64: ${{ secrets.KAPLAY_RELEASE_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Init MPVKit submodule (shallow, no recursive libass)
        run: |
          git submodule sync -- MPVKit || true
          git -c protocol.version=2 submodule update --init --depth=1 MPVKit || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Accept Android licenses
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Resolve persistent release keystore
        run: |
          set -euo pipefail
          if [[ -z "${KAPLAY_RELEASE_KEYSTORE_BASE64:-}" ]]; then
            echo "KAPLAY_RELEASE_KEYSTORE_BASE64 is required; refusing ephemeral release signing." >&2
            exit 1
          fi
          for required in KAPLAY_RELEASE_STORE_PASSWORD KAPLAY_RELEASE_KEY_ALIAS KAPLAY_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "${required} is required for release signing." >&2
              exit 1
            fi
          done

          store_file="${RUNNER_TEMP}/kaplay-release.jks"
          printf '%s' "$KAPLAY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$store_file"
          test -s "$store_file"
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "KAPLAY_RELEASE_STORE_FILE=$store_file"
            echo "KAPLAY_RELEASE_STORE_PASSWORD=$KAPLAY_RELEASE_STORE_PASSWORD"
            echo "KAPLAY_RELEASE_KEY_ALIAS=$KAPLAY_RELEASE_KEY_ALIAS"
            echo "KAPLAY_RELEASE_KEY_PASSWORD=$KAPLAY_RELEASE_KEY_PASSWORD"
          } > local.properties
          echo "local.properties generated with persistent release keystore."

      - name: Assemble full release APK
        id: assemble
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew :androidApp:assembleFullRelease --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee "/tmp/gradle-release.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_ENV"
          exit "$status"

      - name: Upload Gradle release log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-release-log
          path: /tmp/gradle-release.log

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kaplay-full-release-apk
          path: |
            androidApp/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

  pages:
    name: publish-plugin-pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage plugin at repo root
        run: |
          mkdir -p _site
          cp -r plugins/tomato/. _site/
          find _site -type f | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
