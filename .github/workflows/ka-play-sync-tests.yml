name: KA Play sync unit tests

on:
  push:
    branches:
      - kaplay-rebrand
    paths:
      - 'composeApp/src/commonMain/kotlin/com/kaplay/app/core/sync/**'
      - 'composeApp/src/commonMain/kotlin/com/kaplay/app/features/library/**'
      - 'composeApp/src/commonMain/kotlin/com/kaplay/app/features/watching/**'
      - 'composeApp/src/commonMain/kotlin/com/kaplay/app/features/watched/**'
      - 'composeApp/src/commonTest/**'
      - 'supabase/**'
      - '.github/workflows/ka-play-sync-tests.yml'
  workflow_dispatch:

concurrency:
  group: ka-play-sync-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-unit-tests:
    name: testAndroidHostTest (sync)
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dorg.gradle.workers.max=2
      KOTLIN_COMPILER_EXECUTION_STRATEGY: in-process
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Init MPVKit submodule (shallow, no recursive libass)
        run: |
          git submodule sync -- MPVKit || true
          git -c protocol.version=2 submodule update --init --depth=1 MPVKit || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-sync-tests-${{ hashFiles('**/libs.versions.toml', '**/*.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Accept Android licenses
        run: |
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Generate local.properties for runner SDK
        run: |
          sdk_dir="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=$sdk_dir" | sed 's#\\#/#g' > local.properties

      - name: Run sync unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew :composeApp:testAndroidHostTest \
            --tests 'com.kaplay.app.core.sync.SyncManagerTest' \
            --tests 'com.kaplay.app.features.library.sync.*' \
            --tests 'com.kaplay.app.features.watching.sync.*' \
            --no-daemon --no-parallel --max-workers=2 --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-sync-test-reports
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore
