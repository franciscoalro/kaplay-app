name: KA Play production auth debug (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-auth-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Explicitly authorized manual auth reachability test. Publishable key only.
      KAPLAY_SUPABASE_URL: https://iibureqvpurmbgqupnvl.supabase.co
      KAPLAY_SUPABASE_ANON_KEY: sb_publishable_cZimpG5X5AHudRZYYPK4iA_NoowxYlp
      KAPLAY_BUILD_ONLY: 'false'
      KAPLAY_RELEASE_KEYSTORE_B64: ${{ secrets.KAPLAY_RELEASE_KEYSTORE_B64 }}
      KAPLAY_RELEASE_STORE_PASSWORD: ${{ secrets.KAPLAY_RELEASE_STORE_PASSWORD }}
      KAPLAY_RELEASE_KEY_ALIAS: ${{ secrets.KAPLAY_RELEASE_KEY_ALIAS }}
      KAPLAY_RELEASE_KEY_PASSWORD: ${{ secrets.KAPLAY_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure stable Debug signing
        shell: bash
        run: |
          set -euo pipefail
          for required in KAPLAY_RELEASE_KEYSTORE_B64 KAPLAY_RELEASE_STORE_PASSWORD KAPLAY_RELEASE_KEY_ALIAS KAPLAY_RELEASE_KEY_PASSWORD; do
            test -n "${!required:-}" || { echo "$required is required" >&2; exit 1; }
          done
          store_file="${RUNNER_TEMP}/kaplay-debug-auth.jks"
          printf '%s' "$KAPLAY_RELEASE_KEYSTORE_B64" | base64 --decode > "$store_file"
          test -s "$store_file"
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "KAPLAY_RELEASE_STORE_FILE=$store_file"
            echo "KAPLAY_RELEASE_STORE_PASSWORD=$KAPLAY_RELEASE_STORE_PASSWORD"
            echo "KAPLAY_RELEASE_KEY_ALIAS=$KAPLAY_RELEASE_KEY_ALIAS"
            echo "KAPLAY_RELEASE_KEY_PASSWORD=$KAPLAY_RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Validate production endpoint reachability
        run: |
          set -euo pipefail
          test "$KAPLAY_SUPABASE_URL" = 'https://iibureqvpurmbgqupnvl.supabase.co'
          test "$KAPLAY_BUILD_ONLY" = 'false'
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$KAPLAY_SUPABASE_URL/auth/v1/health")
          case "$code" in 200|401|404) ;; *) echo "unexpected health status: $code" >&2; exit 1 ;; esac

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon

      - name: Verify generated endpoint and package
        shell: bash
        run: |
          set -euo pipefail
          config=$(find composeApp/build/generated -type f -name 'SupabaseConfig.kt' -print -quit)
          test -n "$config"
          grep -Fq 'https://iibureqvpurmbgqupnvl.supabase.co' "$config"
          ! grep -Fq 'build-only.invalid' "$config"
          apk=$(find androidApp/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sha256sum "$apk"
          mkdir -p build-artifacts
          cp "$apk" build-artifacts/ka-play-full-debug-auth.apk
          printf 'variant=fullDebug\nfunctional_homologation=NOT_PERFORMED\n' > build-artifacts/BUILD_METADATA.txt

      - name: Upload auth debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-full-debug-auth
          path: build-artifacts/
          retention-days: 3
