name: KA Play Android build only

on:
  workflow_dispatch:
    inputs:
      production_auth_debug:
        description: 'Use production Supabase for an authorized auth reachability test'
        required: false
        default: false
        type: boolean
  push:
    branches:
      - kaplay-rebrand
      - agentic/ka-play-production-toolkit-20261101

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Default remains non-routable. Production mode is manual and explicitly authorized.
      KAPLAY_BUILD_ONLY: ${{ inputs.production_auth_debug == true && 'false' || 'true' }}
      KAPLAY_SUPABASE_URL: ${{ inputs.production_auth_debug == true && 'https://iibureqvpurmbgqupnvl.supabase.co' || 'https://build-only.invalid' }}
      KAPLAY_SUPABASE_ANON_KEY: ${{ inputs.production_auth_debug == true && 'sb_publishable_cZimpG5X5AHudRZYYPK4iA_NoowxYlp' || 'build-only-placeholder' }}
      KAPLAY_RELEASE_KEYSTORE_B64: ${{ secrets.KAPLAY_RELEASE_KEYSTORE_B64 }}
      KAPLAY_RELEASE_STORE_PASSWORD: ${{ secrets.KAPLAY_RELEASE_STORE_PASSWORD }}
      KAPLAY_RELEASE_KEY_ALIAS: ${{ secrets.KAPLAY_RELEASE_KEY_ALIAS }}
      KAPLAY_RELEASE_KEY_PASSWORD: ${{ secrets.KAPLAY_RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure stable Debug signing
        shell: bash
        run: |
          set -euo pipefail
          for required in KAPLAY_RELEASE_KEYSTORE_B64 KAPLAY_RELEASE_STORE_PASSWORD KAPLAY_RELEASE_KEY_ALIAS KAPLAY_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!required:-}" ]]; then
              echo "${required} is required for stable Debug signing." >&2
              exit 1
            fi
          done
          store_file="${RUNNER_TEMP}/kaplay-debug-stable.jks"
          printf '%s' "$KAPLAY_RELEASE_KEYSTORE_B64" | base64 --decode > "$store_file"
          test -s "$store_file"
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "KAPLAY_RELEASE_STORE_FILE=$store_file"
            echo "KAPLAY_RELEASE_STORE_PASSWORD=$KAPLAY_RELEASE_STORE_PASSWORD"
            echo "KAPLAY_RELEASE_KEY_ALIAS=$KAPLAY_RELEASE_KEY_ALIAS"
            echo "KAPLAY_RELEASE_KEY_PASSWORD=$KAPLAY_RELEASE_KEY_PASSWORD"
          } > local.properties

      - name: Validate debug backend configuration
        run: ./scripts/validate_debug_backend_config.sh

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon

      - name: Verify APK and write build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c '%s' "$apk")
          mkdir -p build-artifacts
          cp "$apk" build-artifacts/ka-play-full-debug.apk
          printf 'variant=fullDebug\npath=%s\nsize_bytes=%s\nsha256=%s\nfunctional_homologation=NOT_PERFORMED\n' "$apk" "$size" "$sha256" > build-artifacts/BUILD_METADATA.txt
          sha256sum build-artifacts/ka-play-full-debug.apk > build-artifacts/SHA256SUMS
          ls -lh build-artifacts
          cat build-artifacts/BUILD_METADATA.txt

      - name: Scan generated config and APK for privileged credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='service[_-]?role|sb_secret_|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'
          config=$(find composeApp/build/generated -type f -name 'SupabaseConfig.kt' -print -quit)
          test -n "$config"
          if [[ "$KAPLAY_BUILD_ONLY" == 'true' ]]; then
            grep -Fq 'https://build-only.invalid' "$config"
            ! grep -Eiq 'localhost|iibureqvpurmbgqupnvl\\.supabase\\.co' "$config"
          else
            grep -Fq 'https://iibureqvpurmbgqupnvl.supabase.co' "$config"
            ! grep -Fq 'build-only.invalid' "$config"
          fi
          if grep -Eiq "$pattern" "$config"; then
            echo 'Privileged credential material found in generated SupabaseConfig.kt' >&2
            exit 1
          fi
          apk=build-artifacts/ka-play-full-debug.apk
          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Eiq "$pattern"; then
              echo "Privileged credential material found in APK dex: $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\\.dex$')

      - name: Upload Full Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-full-debug-build-only
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7

  preview-screenshot:
    name: isolated profile preview screenshot
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download Full Debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ka-play-full-debug-build-only
          path: build-artifacts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-30 system-images;android-30;default;x86_64'

      - name: Run isolated emulator and capture first screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            sleep 30
            sleep 20
            adb install -r build-artifacts/ka-play-full-debug.apk
            adb shell am force-stop com.kaplay.app.debug || true
            adb shell monkey -p com.kaplay.app.debug 1 || true
            sleep 12
            mkdir -p preview-screenshots
            adb exec-out screencap -p > preview-screenshots/profile-selection-debug.png
            adb shell dumpsys package com.kaplay.app.debug | grep -E 'versionName|versionCode' > preview-screenshots/package.txt || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml preview-screenshots/window.xml >/dev/null 2>&1 || true
            if grep -Eqi "isn't responding|is not responding|Close app|Settings" preview-screenshots/window.xml 2>/dev/null; then echo 'Invalid preview: system ANR dialog detected' >&2; exit 1; fi

      - name: Upload isolated preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-profile-preview-screenshots
          path: preview-screenshots/
          if-no-files-found: warn
          retention-days: 7

  compose-library-screenshots:
    name: Compose Library UI screenshots
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build-only
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-30 build-tools;35.0.0 system-images;android-30;default;x86_64'

      - name: Create empty local Gradle properties
        run: ': > local.properties'

      - name: Run Library Compose screenshot test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 5
          # Some hosted runners expose /dev/kvm without granting the runner user
          # access. Force software CPU emulation so adb cannot attach to a half-booted
          # device (which was reported as API level 1 and broke split-APK install).
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -no-accel
          disable-animations: true
          script: |
            ./gradlew :androidApp:connectedFullDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kaplay.android.LibraryTrackingUiTest -Pandroid.testInstrumentationRunnerArguments.libraryScreenshots=true --no-daemon
            mkdir -p compose-screenshots
            adb shell pm list packages | grep kaplay > compose-screenshots/packages.txt || true
            for pkg in $(adb shell pm list packages | sed 's/package://' | grep kaplay || true); do for screenshot in library-manage.png library-create.png library-edit.png library-delete.png; do adb exec-out run-as "$pkg" cat "cache/$screenshot" > "compose-screenshots/$pkg-$screenshot" 2>/dev/null || true; done; done
            find compose-screenshots -type f -name '*.png' -size +100c -exec sh -c 'for f do xxd -p -l 8 "$f" | grep -qi '^89504e470d0a1a0a$' || rm -f "$f"; done' sh {} +
            test -s "$(find compose-screenshots -name 'library-manage.png' -size +100c -print -quit)"

      - name: Upload Compose screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-library-compose-screenshots
          path: compose-screenshots/
          if-no-files-found: warn
          retention-days: 7
