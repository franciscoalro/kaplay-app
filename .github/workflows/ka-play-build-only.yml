name: KA Play Android build only

on:
  workflow_dispatch:
  push:
    branches:
      - kaplay-rebrand

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Debug preview is explicitly authorized to use the public Supabase endpoint.
      # This is the publishable/anon key only; no service-role credential is used.
      KAPLAY_SUPABASE_URL: https://iibureqvpurmbgqupnvl.supabase.co
      KAPLAY_SUPABASE_ANON_KEY: sb_publishable_cZimpG5X5AHudRZYYPK4iA_NoowxYlp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create empty local Gradle properties
        run: |
          : > local.properties

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon

      - name: Verify APK and write build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c '%s' "$apk")
          mkdir -p build-artifacts
          cp "$apk" build-artifacts/ka-play-full-debug.apk
          printf 'variant=fullDebug\npath=%s\nsize_bytes=%s\nsha256=%s\nfunctional_homologation=NOT_PERFORMED\n' "$apk" "$size" "$sha256" > build-artifacts/BUILD_METADATA.txt
          sha256sum build-artifacts/ka-play-full-debug.apk > build-artifacts/SHA256SUMS
          ls -lh build-artifacts
          cat build-artifacts/BUILD_METADATA.txt

      - name: Scan generated config and APK for privileged credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='service[_-]?role|sb_secret_|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'
          config=$(find composeApp/build/generated -type f -name 'SupabaseConfig.kt' -print -quit)
          test -n "$config"
          if grep -Eiq "$pattern" "$config"; then
            echo 'Privileged credential material found in generated SupabaseConfig.kt' >&2
            exit 1
          fi
          apk=build-artifacts/ka-play-full-debug.apk
          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Eiq "$pattern"; then
              echo "Privileged credential material found in APK dex: $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\\.dex$')

      - name: Upload Full Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-full-debug-build-only
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7

  preview-screenshot:
    name: isolated profile preview screenshot
    needs: build-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download Full Debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ka-play-full-debug-build-only
          path: build-artifacts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-30 system-images;android-30;default;x86_64'

      - name: Run isolated emulator and capture first screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: Nexus 5
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            sleep 30
            sleep 20
            adb install -r build-artifacts/ka-play-full-debug.apk
            adb shell am force-stop com.kaplay.app.debug || true
            adb shell monkey -p com.kaplay.app.debug 1 || true
            sleep 12
            mkdir -p preview-screenshots
            adb exec-out screencap -p > preview-screenshots/profile-selection-debug.png
            adb shell dumpsys package com.kaplay.app.debug | grep -E 'versionName|versionCode' > preview-screenshots/package.txt || true
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/window.xml preview-screenshots/window.xml >/dev/null 2>&1 || true
            if grep -Eqi "isn't responding|is not responding|Close app|Settings" preview-screenshots/window.xml 2>/dev/null; then
              echo 'Invalid preview: system ANR dialog detected' >&2
              exit 1
            fi

      - name: Upload isolated preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-profile-preview-screenshots
          path: preview-screenshots/
          if-no-files-found: warn
          retention-days: 7
