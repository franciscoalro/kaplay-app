name: KA Play Android Debug preview (connected or offline)

on:
  workflow_dispatch:
    inputs:
      backend_mode:
        description: 'connected requires a test Supabase project; offline-preview cannot authenticate'
        required: true
        default: connected
        type: choice
        options:
          - connected
          - offline-preview
  push:
    branches:
      - kaplay-rebrand

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BACKEND_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.backend_mode || 'offline-preview' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve and preflight Debug backend
        id: backend
        shell: bash
        env:
          DEBUG_URL: ${{ secrets.KAPLAY_DEBUG_SUPABASE_URL }}
          DEBUG_KEY: ${{ secrets.KAPLAY_DEBUG_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          case "$BACKEND_MODE" in
            offline-preview)
              {
                echo 'KAPLAY_SUPABASE_URL=https://build-only.invalid'
                echo 'KAPLAY_SUPABASE_ANON_KEY=build-only-placeholder'
                echo 'KAPLAY_SUPABASE_FALLBACK_URL='
              } >> "$GITHUB_ENV"
              echo 'backend_verified=false' >> "$GITHUB_OUTPUT"
              echo 'OFFLINE PREVIEW ONLY: cloud authentication and synchronization will not work.'
              ;;
            connected)
              if [[ -z "$DEBUG_URL" || -z "$DEBUG_KEY" ]]; then
                echo 'Missing KAPLAY_DEBUG_SUPABASE_URL or KAPLAY_DEBUG_SUPABASE_ANON_KEY repository secret. Refusing broken connected APK.' >&2
                exit 1
              fi
              python3 - <<'PY'
          import base64
          import json
          import os
          from urllib.parse import urlsplit

          url = os.environ["DEBUG_URL"]
          key = os.environ["DEBUG_KEY"]
          parsed = urlsplit(url)
          hostname = (parsed.hostname or "").lower()
          if (
              url != url.strip()
              or parsed.scheme != "https"
              or not hostname.endswith(".supabase.co")
              or hostname == "iibureqvpurmbgqupnvl.supabase.co"
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port not in (None, 443)
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
              or not hostname
          ):
              raise SystemExit("Only a non-production HTTPS *.supabase.co project URL is permitted for connected Debug builds.")
          if url.endswith("/"):
              raise SystemExit("Remove trailing slash from KAPLAY_DEBUG_SUPABASE_URL.")
          if key != key.strip() or "\n" in key or "\r" in key:
              raise SystemExit("Invalid whitespace in debug publishable/anon key.")
          if key.startswith("sb_publishable_"):
              pass
          elif key.startswith("eyJ"):
              try:
                  payload = key.split(".")[1]
                  claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
              except (ValueError, IndexError, UnicodeError) as exc:
                  raise SystemExit("Invalid legacy anon key format.") from exc
              if claims.get("role") != "anon":
                  raise SystemExit("Legacy key must have role=anon; privileged keys are forbidden.")
          else:
              raise SystemExit("Only Supabase publishable or legacy anon keys are permitted.")
          print("Development backend configuration accepted (production URL rejected).")
          PY
              http_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --output /dev/null --write-out '%{http_code}' --header "apikey: $DEBUG_KEY" "$DEBUG_URL/auth/v1/health")"
              if [[ "$http_code" != "200" ]]; then
                echo "Isolated Supabase Auth health check returned HTTP $http_code (expected 200)." >&2
                exit 1
              fi
              {
                printf 'KAPLAY_SUPABASE_URL=%s\n' "$DEBUG_URL"
                printf 'KAPLAY_SUPABASE_ANON_KEY=%s\n' "$DEBUG_KEY"
                printf 'KAPLAY_SUPABASE_FALLBACK_URL=\n'
              } >> "$GITHUB_ENV"
              echo 'backend_verified=true' >> "$GITHUB_OUTPUT"
              echo 'Isolated Auth endpoint reachable. Sign-in, RPCs and profile sync still require functional tests.'
              ;;
            *)
              echo 'Unknown BACKEND_MODE (expected connected or offline-preview).' >&2
              exit 1
              ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Create empty local Gradle properties
        run: |
          : > local.properties

      - name: Build Full Debug APK
        run: ./gradlew :androidApp:assembleFullDebug --no-daemon

      - name: Verify APK and write build metadata
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk -type f -name '*.apk' -print -quit)
          test -n "$apk"
          sha256=$(sha256sum "$apk" | cut -d' ' -f1)
          size=$(stat -c '%s' "$apk")
          mkdir -p build-artifacts
          cp "$apk" build-artifacts/ka-play-full-debug.apk
          printf 'variant=fullDebug\nbackend_mode=%s\npath=%s\nsize_bytes=%s\nsha256=%s\nfunctional_homologation=NOT_PERFORMED\n' "$BACKEND_MODE" "$apk" "$size" "$sha256" > build-artifacts/BUILD_METADATA.txt
          sha256sum build-artifacts/ka-play-full-debug.apk > build-artifacts/SHA256SUMS
          ls -lh build-artifacts
          cat build-artifacts/BUILD_METADATA.txt

      - name: Scan generated config and APK for privileged credentials
        shell: bash
        run: |
          set -euo pipefail
          pattern='service[_-]?role|sb_secret_|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'
          config=$(find composeApp/build/generated -type f -name 'SupabaseConfig.kt' -print -quit)
          test -n "$config"
          if ! grep -Fq "const val URL = \"$KAPLAY_SUPABASE_URL\"" "$config"; then
            echo 'Generated Supabase URL differs from validated backend configuration.' >&2
            exit 1
          fi
          if ! grep -Fq "const val ANON_KEY = \"$KAPLAY_SUPABASE_ANON_KEY\"" "$config"; then
            echo 'Generated Supabase key differs from validated backend configuration.' >&2
            exit 1
          fi
          if ! grep -Fq 'const val FALLBACK_URL = ""' "$config"; then
            echo 'Debug fallback must be empty; refusing possible cross-environment retry.' >&2
            exit 1
          fi
          if grep -Eiq "$pattern" "$config"; then
            echo 'Privileged credential material found in generated SupabaseConfig.kt' >&2
            exit 1
          fi
          apk=build-artifacts/ka-play-full-debug.apk
          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -Eiq "$pattern"; then
              echo "Privileged credential material found in APK dex: $dex" >&2
              exit 1
            fi
          done < <(unzip -Z1 "$apk" | grep -E '^classes[0-9]*\\.dex$')

      - name: Upload Full Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-full-debug-${{ github.event_name == 'workflow_dispatch' && inputs.backend_mode == 'connected' && 'connected' || 'offline-preview' }}
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7

  preview-screenshot:
    name: isolated profile preview screenshot
    needs: build-only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download Full Debug APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ka-play-full-debug-${{ github.event_name == 'workflow_dispatch' && inputs.backend_mode == 'connected' && 'connected' || 'offline-preview' }}
          path: build-artifacts

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 system-images;android-34;default;x86_64'

      - name: Run isolated emulator and capture first screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: |
            adb install -r build-artifacts/ka-play-full-debug.apk
            adb shell am force-stop com.kaplay.app.debug || true
            adb shell monkey -p com.kaplay.app.debug 1 || true
            sleep 8
            mkdir -p preview-screenshots
            adb exec-out screencap -p > preview-screenshots/profile-selection-debug.png
            adb shell dumpsys package com.kaplay.app.debug | grep -E 'versionName|versionCode' > preview-screenshots/package.txt || true

      - name: Upload isolated preview screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ka-play-profile-preview-screenshots
          path: preview-screenshots/
          if-no-files-found: warn
          retention-days: 7
