version: 2.1

# Nuvio mirror build - compile Android "full" Kotlin sources (with the Tomato
# plugin code referenced from composeApp/src/fullCommonMain) on the cloud.
# No signing keystore or release secrets are used here.

jobs:
  kotlin-compile-full:
    docker:
      - image: cimg/android:2024.01
    resource_class: large
    environment:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dorg.gradle.workers.max=2
      KOTLIN_COMPILER_EXECUTION_STRATEGY: in-process
    steps:
      - checkout
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "gradle/libs.versions.toml" }}
            - gradle-v1-
      - run:
          name: Install Android SDK packages
          command: |
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-37.1" "platforms;android-36" "build-tools;36.0.0" "platform-tools" || true
            echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
      - run:
          name: Compile Nuvio full debug Kotlin
          command: |
            chmod +x ./gradlew
            set +e
            ./gradlew :androidApp:compileFullDebugKotlin --no-daemon --no-parallel --max-workers=2 --stacktrace 2>&1 | tee /tmp/gradle-build.log
            status=${PIPESTATUS[0]}
            echo "$status" > /tmp/gradle-exit-code
            exit 0
      - when:
          condition: always
          steps:
            - store_artifacts:
                path: /tmp/gradle-build.log
                destination: gradle-build.log
      - save_cache:
          key: gradle-v1-{{ checksum "gradle/libs.versions.toml" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - run:
          name: Report Gradle result
          command: |
            status=$(cat /tmp/gradle-exit-code 2>/dev/null || echo 1)
            echo "Gradle exit code: $status"
            exit "$status"

workflows:
  build-nuvio:
    jobs:
      - kotlin-compile-full
