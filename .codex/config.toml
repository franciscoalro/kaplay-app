# Configuração de perfis especializados Codex. O usuário precisa ter suporte a custom agents no cliente.
# Nenhum perfil autoriza execução de release ou mudanças de produção.
[agents.ka_delivery_lead]
description = "Orquestrador KA Play: backlog, gates e entrega"
config_file = "agents/ka_delivery_lead.toml"

[agents.ka_supabase_sync]
description = "Supabase sync/RLS e integridade de perfis"
